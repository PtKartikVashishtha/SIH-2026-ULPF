[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ulpf-contracts"
version = "0.1.0"
description = "ULPF shared contracts — Pydantic models generated from JSON Schema"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator>=0.25,<1",
    "jsonschema>=4.20,<5",
    "pytest>=8,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["ulpf_contracts"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["ulpf_contracts/generated/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
