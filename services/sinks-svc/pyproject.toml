[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ulpf-sinks-svc"
version = "0.1.0"
description = "ULPF C8 — SIEM adapter + Parquet writer"
requires-python = ">=3.11"
dependencies = [
    "ulpf-contracts",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sinks_svc"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
